# Everything here was run by hand before each commit during 0.01. A workflow
# means a change that breaks the installer or the bridge cannot land quietly.
# It deliberately does not try to run Noren: that needs Hyprland, Omarchy and a
# Chromium, none of which exist on a runner. These are the checks that do not.
name: checks

on:
  push:
    branches: [master]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell parses
        run: bash -n install.sh

      - name: Extension JavaScript parses
        run: for f in extension/*.js; do node --check "$f"; done

      - name: Python parses
        run: |
          python3 - <<'PY'
          import ast, pathlib
          for f in ["bin/noren", "host/noren-host", "host/noren_theme.py"]:
              ast.parse(pathlib.Path(f).read_text(), f)
              print("ok", f)
          PY

      - name: Manifests are valid JSON, and agree with VERSION
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys

          version = pathlib.Path("VERSION").read_text().strip()
          plugin = json.loads(pathlib.Path("manifest.json").read_text())
          ext = json.loads(pathlib.Path("extension/manifest.json.template").read_text())

          fail = []
          if plugin["version"] != version:
              fail.append(f'manifest.json version {plugin["version"]!r} != VERSION {version!r}')
          if ext.get("version_name") != version:
              fail.append(f'extension version_name {ext.get("version_name")!r} != VERSION {version!r}')
          # Chrome refuses anything else, and refuses it silently at load time.
          if not re.fullmatch(r"\d+(\.\d+){0,3}", ext["version"]):
              fail.append(f'extension version {ext["version"]!r} is not 1-4 dotted integers')
          # The service worker the manifest names has to exist.
          worker = ext["background"]["service_worker"]
          if not pathlib.Path("extension", worker).is_file():
              fail.append(f"manifest names {worker}, which is not in extension/")

          print("\n".join(fail) if fail else "manifests agree")
          sys.exit(1 if fail else 0)
          PY

      - name: Nothing private is tracked
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, sys
          tracked = subprocess.run(["git", "ls-files"], capture_output=True,
                                   text=True, check=True).stdout.split()
          fail = []
          # The per-machine key pins the extension id. It is generated by
          # install.sh, mirrored outside the repo, and must never be committed.
          for name in tracked:
              if name.endswith((".pem", ".key")) or name.endswith("extension/manifest.json"):
                  fail.append(f"{name} is tracked and must not be")
          # Assembled at runtime, never written out whole: spelled literally,
          # this file would contain the thing it is looking for and flag
          # itself. (It did, on the first run.)
          head = b"-" * 5 + b"BEGIN"
          kind = b"PRIVATE" + b" KEY"
          for name in tracked:
              body = pathlib.Path(name).read_bytes()
              if head in body and kind in body:
                  fail.append(f"{name} contains private key material")
          print("\n".join(fail) if fail else "clean")
          sys.exit(1 if fail else 0)
          PY
